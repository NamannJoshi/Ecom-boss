services:

  ecomboss-web:
    container_name: ecomboss-web
    build:
      context: .
      dockerfile: ./EcomBoss.Web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=ecomboss;Username=ecomboss;Password=BossShaakalaaka@3590

      Redis__ConnectionString: redis:6379

      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ecomboss
      RabbitMQ__Password: BossShaakalaaka@3590

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    container_name: ecomboss-postgres
    environment:
      POSTGRES_DB: ecomboss
      POSTGRES_USER: ecomboss
      POSTGRES_PASSWORD: BossShaakalaaka@3590
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ecomboss -d ecomboss"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: ecomboss-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: ecomboss-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ecomboss
      RABBITMQ_DEFAULT_PASS: BossShaakalaaka@3590
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: